name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".prettierignore"
      - "config/env.example"
  # On pull_request, path filtering is handled by the `changes` job because the
  # repository ruleset requires "Typecheck, Lint & Test". Workflow-level paths-ignore
  # would prevent check runs from being created, leaving PRs blocked in a pending state.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# PR pushes supersede each other; main builds queue instead of cancelling so
# a deploy is never interrupted halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Check Changed Files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'config/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'next.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.mjs'
              - 'Dockerfile'
              - '.dockerignore'
              - 'firebase.json'
              - 'firestore.indexes.json'
              - 'firestore.rules'
              - '.github/**'

  verify:
    name: Typecheck, Lint & Test
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The version comes from "packageManager" in package.json; pinning it
      # here as well makes the action fail whenever the two disagree.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      # The Firestore emulator that server tests run against is a Java program.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Same build the Docker image runs (Next.js standalone output + service worker).
      - name: Build web app
        run: pnpm build

  deploy:
    name: Deploy to Cloud Run
    needs: verify
    # `changes` is skipped on push, and the implicit success() also looks at
    # skipped ancestors, so without always() this job never runs on main.
    # https://github.com/actions/runner/issues/2205
    # Until the Google Cloud project is set up (docs/deploy-gcp.md), main pushes
    # only verify and nothing is deployed.
    if: always() && needs.verify.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Serialize production deploys across concurrent main pushes.
    concurrency:
      group: production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Keyless auth through Workload Identity Federation; no JSON key is stored.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg GITHUB_SHA="${GITHUB_SHA}" -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the deploy so new composite indexes start building before the
      # new code serves traffic. Indexes only ever get added here; firebase never
      # deletes an index that is missing from the file without --force.
      - name: Deploy Firestore rules and indexes
        run: pnpm exec firebase deploy --only firestore --project "${PROJECT_ID}" --non-interactive

      # Service settings (env vars, secrets, service account, timeout) are set once
      # when the service is created (docs/deploy-gcp.md); a deploy only swaps the image.
      - name: Deploy Cloud Run service
        run: gcloud run deploy "${SERVICE}" --image "${IMAGE}" --region "${REGION}" --quiet
