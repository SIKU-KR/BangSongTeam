name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # No paths-ignore here: the main ruleset requires "Typecheck, Lint & Test",
  # and a docs-only PR that skipped the workflow would never report it.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR pushes supersede each other; main builds queue instead of cancelling so
# a deploy is never interrupted halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; pinning it
      # here as well makes the action fail whenever the two disagree.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Must run before the dry run: the Cloudflare Vite plugin emits
      # dist/client plus the generated wrangler.json that carries the assets
      # binding. Without it the dry run validates a Worker with no frontend.
      - name: Build web app
        run: pnpm build

      - name: Verify Worker deployment (dry run)
        run: pnpm exec wrangler deploy --dry-run

  deploy:
    name: Migrate D1 & Deploy Worker
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Serialize production deploys across concurrent main pushes.
    concurrency:
      group: production
      cancel-in-progress: false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify Cloudflare credentials
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "The token needs Workers Scripts edit, D1 edit and R2 edit."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; pinning it
      # here as well makes the action fail whenever the two disagree.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      # Runs before the deploy so the schema is in place when the new code
      # starts serving traffic.
      - name: Apply D1 production migrations
        run: pnpm db:migrate:prod

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
