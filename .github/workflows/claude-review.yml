name: Claude Review

# Advisory only: not a required check, so workflow-level path filtering is safe
# here (unlike ci-cd.yml). Runs once when a PR becomes reviewable; comment
# "@claude review" on the PR to run it again after new pushes.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "eslint.config.mjs"
      - ".github/workflows/**"
      - ".claude/**"
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    # Public repo: skip fork PRs and only let people with write access trigger
    # a run by comment, since the job holds the Claude token.
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # issue_comment runs on the default branch; switch to the PR so Claude
      # reads the code under review. Nothing from the PR is executed.
      # pull/<n>/head outlives the head branch, which is deleted on merge.
      - name: Checkout PR head
        if: github.event_name == 'issue_comment'
        run: |
          git fetch --depth=1 origin "pull/$PR_NUMBER/head"
          git checkout --detach FETCH_HEAD

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /review-pr ${{ env.PR_NUMBER }}
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
